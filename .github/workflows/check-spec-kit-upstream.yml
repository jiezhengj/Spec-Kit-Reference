name: 检查 Spec Kit 上游

concurrency:
  group: spec-kit-upstream-check
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 Reference 仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 添加官方上游远端
        run: |
          upstream_url=$(git remote get-url upstream 2>/dev/null || true)
          if [ -z "$upstream_url" ]; then
            git remote add upstream https://github.com/github/spec-kit.git
          elif [ "$upstream_url" != "https://github.com/github/spec-kit.git" ] && [ "$upstream_url" != "https://github.com/github/spec-kit" ]; then
            echo "upstream 远端地址异常：$upstream_url" >&2
            exit 1
          fi

      - name: 检查上游基线
        id: upstream
        continue-on-error: true
        run: |
          set +e
          python scripts/check_upstream.py > upstream-update.md 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 检查器出错时停止
        if: steps.upstream.outputs.status != '0' && steps.upstream.outputs.status != '2'
        run: |
          cat upstream-update.md
          exit 1

      - name: 创建或更新上游审查 Issue
        if: steps.upstream.outputs.status == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Spec Kit 上游变更需要审查"
          issue_number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file upstream-update.md
          else
            gh issue create --title "$title" --body-file upstream-update.md
          fi

  validate:
    name: 验证 ${{ matrix.os }} 环境检查脚本
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出 Reference 仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取上游以供验证
        shell: bash
        run: |
          git remote add upstream https://github.com/github/spec-kit.git
          git fetch --quiet upstream main

      - name: 验证 POSIX 脚本
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/check-upstream.sh --no-fetch

      - name: 验证 PowerShell 脚本
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\check-upstream.ps1 --no-fetch
