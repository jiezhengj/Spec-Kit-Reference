name: 检查 Spec Kit CLI 契约

concurrency:
  group: spec-kit-cli-contract
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: 单元测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 运行单元测试
        env:
          PYTHONUTF8: "1"
        run: python -m unittest tests.test_spec_kit_component_updater -v

  contract:
    name: 官方 CLI 输出契约
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装 uv 与官方 CLI
        run: |
          python -m pip install --upgrade uv
          uv tool install specify-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 校验 CLI 输出契约
        env:
          PYTHONUTF8: "1"
        run: |
          specify --version
          python scripts/check_cli_contract.py
